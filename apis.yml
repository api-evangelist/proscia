apis:
- name: Concentriq Platform API
  description: >-
    The Concentriq REST API exposes whole-slide images, annotations, regions of interest,
    users, and clinical/case data on Proscia's open, API-first digital pathology platform.
    Authentication is via a Concentriq API key (concentriq-api-key header), a pre-obtained
    JWT bearer token, or email+password basic auth exchanged for a JWT. The API base is the
    tenant Concentriq deployment endpoint with an /api path.
  humanURL: https://proscia.com/build-on-concentriq/
  baseURL: https://cloud.proscia.com/api
  tags:
  - Digital Pathology
  - REST
  - Whole Slide Imaging
  properties:
  - type: Authentication
    url: authentication/proscia-authentication.yml
- name: Concentriq Embeddings API
  description: >-
    Concentriq Embeddings is Proscia's foundation-model API. It extracts rich visual feature
    vectors (embeddings) at any magnification from whole-slide images in Concentriq LS using
    widely used pathology foundation models (DinoV2, PLIP, ConvNext, CTransPath, H-optimus-0,
    Virchow), turning large image files into standardized, lightweight embeddings for AI model
    development. Accessed via the first-party proscia-ai-tools Python client.
  humanURL: https://github.com/Proscia/proscia-ai-tools
  baseURL: https://cloud.proscia.com/api
  tags:
  - Foundation Models
  - Embeddings
  - Artificial Intelligence
