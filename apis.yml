aid: proscia
name: Proscia
description: >-
  Proscia is a digital pathology software company whose Concentriq platform powers
  AI-driven precision medicine and diagnostic pathology for clinical laboratories,
  pharmaceutical and biotech R&D, CROs, and academic research organizations. Concentriq
  is an open, API-first platform: its REST API, Custom APIs, SDK, Model Context Protocol
  (MCP) data backbone, Concentriq Embeddings foundation-model API, Compute service, and
  Analysis API let developers and data scientists manage whole-slide images, annotations,
  and clinical data and build next-generation pathology AI. Proscia is SOC 2 Type II,
  ISO 27001, and ISO 13485 certified, HIPAA- and GDPR-aligned, and ships FDA 510(k)-cleared
  and CE-IVDR-marked diagnostic products (Concentriq AP-Dx).
